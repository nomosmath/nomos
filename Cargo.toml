[workspace]
members = ["cli", "sdk/rust"]

[package]
name = "nomos-core"
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Formal verification framework for distributed mathematical proof validation"
repository = "https://github.com/nomosmath/nomos"
homepage = "https://nomosmath.xyz"
categories = ["mathematics", "cryptography"]
keywords = ["formal-verification", "proof", "consensus", "goldbach"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
criterion = "0.5"
proptest = "1.5"

[[bench]]
name = "state_commit"
harness = false

[[bench]]
name = "consensus_quorum"
harness = false
